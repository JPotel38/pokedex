  <swiper-container hash-navigation="true" initialSlide="{{initPokemon}}" navigation="true">

      <app-pokemon-details [pokemon]="pokemon"></app-pokemon-details>
    </swiper-slide>
    }
  </swiper-container>
</ion-content>
